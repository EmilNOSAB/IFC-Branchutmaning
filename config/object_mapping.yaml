# Object classification used by the build script (NOT a Bentley file).
#
# For every DGN object category this file defines the DGN level, the IFC entity
# and PredefinedType written to the Item Types, CoClass references and the
# property/quantity sets.  export/SchemaMapping.json is the separate,
# Bentley-format file used by MicroStation's IFC exporter.
#
# Name/description templates may use {id}, {part}, {track}, {side}, {seq},
# {position}, {turnout} and {alignment}.

item_type_library: BU2026_IFC

# Bentley's delivered "IFC Classification" Item Type (IFC_Classes_Types.dgnlib).
# The script imports the library into the DGN and fills the three properties.
# Property names are matched case-insensitively against the candidates below
# (verify with microstation/inspect_environment.py).
bentley_ifc_classification:
  enabled: true
  # Import the library from the dgnlib automatically when it is not in the DGN
  # (ItemTypeLibrary.CloneForFile, same result as Item Types dialog > Import).
  auto_import: true
  dgnlib_file: IFC_Classes_Types.dgnlib
  # Folders are taken from these configuration variables (each also with an
  # ItemTypes subfolder); MSDIR gives the delivered <MSDIR>Default\Dgnlib\ItemTypes.
  dgnlib_search_config_variables: [MS_DGNLIBLIST_ITEMTYPES, MS_DGNLIBLIST, _USTN_INSTALLED_DGNLIBS, MSDIR]
  # Library names are tried as written; item type names are compared without
  # case/spaces/underscores.  When no library name matches, every library in the file is enumerated and the one holding an
  # item type named like item_type_candidates is used (Bentley's help names
  # the item type 'IfcClassification'; the library name is not documented).
  library_name_candidates: [IfcClassification, IFC Classification, IFC_Classes_Types, IFC Classes Types]
  item_type_candidates: [IfcClassification, IFC Classification]
  version_property_candidates: [Version, IFC Version, IfcVersion, Schema]
  class_property_candidates: [Class, IFC Class, IfcClass, Entity]
  type_property_candidates: [Type, IFC Type, IfcType, PredefinedType, Predefined Type]
  version_value: IFC4X3_ADD2
  # Only elements of these IFC classes get the Bentley Item Type.  Carriers of
  # IfcProject/IfcSite do not: the exporter creates project and site itself
  # (ProjectConfigurations).  Whether the exporter turns a classified carrier
  # into IfcBuiltSystem (an IfcGroup) is tested by microstation/probe_exporter.py.
  apply_to_entities: [IfcRail, IfcTrackElement, IfcCourse, IfcElementAssembly, IfcRailwayPart, IfcRailway, IfcSpatialZone, IfcAlignment, IfcBuiltSystem]

# Units for Double Item Type properties whose IFC type is a measure, so that the
# exporter receives the quantity kind (CustomProperty.SetUnits(DgnECUnit)).
# DgnECUnit.FromID ids are tried in order; the one that resolved is written to
# output/model_report.json (item_types.unit_ids).
item_type_units:
  IfcLengthMeasure: [METRE, M]
  IfcPositiveLengthMeasure: [METRE, M]
  IfcQuantityLength: [METRE, M]
  IfcAreaMeasure: [METRE_SQUARED, SQUARE_METRE, SQ_M]
  IfcVolumeMeasure: [METRE_CUBED, CUBIC_METRE, CUB_M]
  IfcQuantityVolume: [METRE_CUBED, CUBIC_METRE, CUB_M]
  IfcQuantityWeight: [KILOGRAM, KG]
  IfcElectricVoltageMeasure: [VOLT, V]
  IfcPowerMeasure: [WATT, W]

classification_systems:
  CoClass_BV: {name: CoClass_BV, source: CoClass, edition: "2.0", description: CoClass Byggnadsverk}
  CoClass_KS: {name: CoClass_KS, source: CoClass, edition: "2.0", description: CoClass Konstruktiva system}
  CoClass_FS: {name: CoClass_FS, source: CoClass, edition: "2.0", description: CoClass Funktionella system}
  CoClass_KO: {name: CoClass_KO, source: CoClass, edition: "2.0", description: CoClass Komponenter}
  CoClass_PR: {name: CoClass_PR, source: CoClass, edition: "2.0", description: CoClass Produktionsresultat}

