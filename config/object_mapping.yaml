  BUILT_SYSTEM:
    level: BU26_SPATIAL
    ifc_entity: IfcBuiltSystem
    predefined_type: RAILWAYTRACK
    classifications: [[CoClass_FS, R, Spårsystem]]

# IFC data types for property/quantity sets (units above, and validate_dgn.py
# checks the item type values against them).
property_sets:
  Pset_Stationing:
    Station: IfcLengthMeasure
    HasIncreasingStation: IfcBoolean
  Pset_RailwayTrackStructurePart:
    HasBallastTrack: IfcBoolean
    HasCWR: IfcBoolean
    IsSunExposed: IfcBoolean
    TrackSupportingStructure: IfcLabel
  Pset_BuiltSystemRailwayTrack:
    TrackID: IfcIdentifier
    TrackNumber: IfcIdentifier
    TrackUsage: IfcLabel
    TrackCharacteristic: IfcLabel
  Pset_ElementAssemblyTypeTractionSwitchingAssembly:
    RatedVoltage: IfcElectricVoltageMeasure
    NominalPower: IfcPowerMeasure
  Pset_SpaceCommon:
    GrossPlannedArea: IfcAreaMeasure
  Pset_CourseCommon:
    NominalLength: IfcPositiveLengthMeasure
    NominalThickness: IfcPositiveLengthMeasure
    NominalWidth: IfcPositiveLengthMeasure
  Pset_TrackElementOccurrenceSleeper:
    HasSpecialEquipment: IfcBoolean
    IsContaminatedSleeper: IfcBoolean

quantity_sets:
  Qto_CourseBaseQuantities:
    Length: IfcQuantityLength
    Width: IfcQuantityLength
    Thickness: IfcQuantityLength
    Volume: IfcQuantityVolume
    GrossVolume: IfcQuantityVolume
    Weight: IfcQuantityWeight
  Qto_SleeperBaseQuantities:
    Length: IfcQuantityLength
    Width: IfcQuantityLength
    Height: IfcQuantityLength
